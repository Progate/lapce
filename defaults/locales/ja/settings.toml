"File Explorer Double Click" = "エクスプローラーでダブルクリック"
"Only allow double-click to open files in the file explorer" = "エクスプローラーではダブルクリックでのみファイルを開きます"
"Auto Reload Plugin" = "プラグインの自動再読み込み"
"Enable auto-reload for the plugin when its configuration changes." = "プラグインの設定が変わったときに、プラグインを自動で読み込み直します。"
