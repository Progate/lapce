# Lapce の UI の日本語訳（→ lapce-app/src/i18n.rs）。
# キーは英語の原文（ソースに書かれたまま）、値は訳文。値の {} は原文の {} と同じ順の値、{0} {1} は何番目の値か。
# 訳語は Lapce が手本にした VS Code の日本語版に揃える。

# 設定
"System" = "システムに合わせる"
"Search Settings" = "設定の検索"
"Plugin Settings" = "プラグインの設定"
"Reset" = "リセット"
"Base Colors" = "基本の色"
"Syntax Colors" = "構文の色"
"UI Colors" = "UI の色"

# 設定の区分
"Core" = "全般"
"Editor" = "エディター"
"UI" = "UI"
"Terminal" = "ターミナル"


